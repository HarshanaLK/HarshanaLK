name: Update code-only SVG project cards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - projects.json
      - .github/scripts/fetch_data.py
      - .github/scripts/generate_projects.py
      - .github/workflows/projects.yml
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Load live GitHub repository data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/fetch_data.py
      - name: Render two SVG project panels
        run: python3 .github/scripts/generate_projects.py merged.json .
      - name: Commit changes only when SVG differs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects.svg projects-light.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update SVG project cards [skip ci]'
            git push
          fi
