name: Update contribution snake SVG

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,12 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/snake.yml'

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate light and dark animated snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: HarshanaLK
          outputs: |
            dist/snake-light.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Verify both SVG files were generated
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/snake-light.svg
          test -s dist/snake-dark.svg
          echo 'Both animated SVG files generated.'
          ls -lh dist/

      - name: Publish generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: 'Update contribution snake SVG [skip ci]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
